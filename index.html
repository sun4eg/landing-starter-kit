<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reforma Madrid</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header"></header>

    <main id="main-content">
      <section class="hero" aria-labelledby="hero-title">
        <header class="container">
          <!-- Introduces the page and its primary purpose. -->
          <h1 id="hero-title">Hero</h1>
        </header>
      </section>

      <section class="button-showcase section" aria-labelledby="button-showcase-title">
        <div class="container flow">
          <h2 id="button-showcase-title">Button component</h2>

          <section class="flow" aria-labelledby="button-variants-title">
            <h3 id="button-variants-title">Variants</h3>
            <ul class="cluster" role="list">
              <li><button class="button button--primary" type="button">Primary</button></li>
              <li><button class="button button--secondary" type="button">Secondary</button></li>
              <li><a class="button button--outline" href="#main-content">Outline link</a></li>
              <li><a class="button button--ghost" href="#main-content">Ghost link</a></li>
            </ul>
          </section>

          <section class="flow" aria-labelledby="button-sizes-title">
            <h3 id="button-sizes-title">Sizes and icons</h3>
            <ul class="cluster" role="list">
              <li><button class="button button--primary button--sm" type="button">Small</button></li>
              <li>
                <button class="button button--primary button--md" type="button">
                  <span class="button__icon button__icon--leading" aria-hidden="true">←</span>
                  Medium
                </button>
              </li>
              <li>
                <button class="button button--primary button--lg" type="button">
                  Large
                  <span class="button__icon button__icon--trailing" aria-hidden="true">→</span>
                </button>
              </li>
            </ul>
          </section>

          <section class="flow" aria-labelledby="button-states-title">
            <h3 id="button-states-title">States and width</h3>
            <ul class="stack" role="list">
              <li><button class="button button--secondary" type="button" disabled>Disabled button</button></li>
              <li>
                <a class="button button--outline" role="link" aria-disabled="true" tabindex="-1">Disabled link</a>
              </li>
              <li>
                <button class="button button--primary button--full" type="button">Full-width button</button>
              </li>
            </ul>
          </section>
        </div>
      </section>

      <section class="services" aria-labelledby="services-title">
        <header class="container">
          <!-- Outlines the available services or offerings. -->
          <h2 id="services-title">Services</h2>
        </header>
      </section>

      <section class="benefits" aria-labelledby="benefits-title">
        <header class="container">
          <!-- Summarizes the main benefits for the audience. -->
          <h2 id="benefits-title">Benefits</h2>
        </header>
      </section>

      <section class="portfolio" aria-labelledby="portfolio-title">
        <header class="container">
          <!-- Provides a place for selected work or case studies. -->
          <h2 id="portfolio-title">Portfolio</h2>
        </header>
      </section>

      <section class="process" aria-labelledby="process-title">
        <header class="container">
          <!-- Describes the steps in a typical process. -->
          <h2 id="process-title">Process</h2>
        </header>
      </section>

      <section class="reviews" aria-labelledby="reviews-title">
        <header class="container">
          <!-- Reserves space for reviews or testimonials. -->
          <h2 id="reviews-title">Reviews</h2>
        </header>
      </section>

      <section class="faq" aria-labelledby="faq-title">
        <header class="container">
          <!-- Groups frequently asked questions and answers. -->
          <h2 id="faq-title">Frequently Asked Questions</h2>
        </header>
      </section>

      <section class="contact" aria-labelledby="contact-title">
        <header class="container">
          <!-- Introduces future contact information and actions. -->
          <h2 id="contact-title">Contact</h2>
        </header>
      </section>
    </main>

    <footer class="site-footer"></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
